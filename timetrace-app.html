<style>
:root{
  --green:#dcefd9; --yellow:#f6eebf; --red:#f4cfd2;
  --ink:#2b2b2b; --soft:rgba(43,43,43,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
  color:var(--ink); --cur:var(--green); background:var(--cur);
  transition:background-color 3s ease; overflow:hidden;
}
body.s1{--cur:var(--yellow)} body.s2{--cur:var(--red)}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;border-radius:50%;width:70vmax;height:70vmax;filter:blur(70px);opacity:.8;
  transition:background-color 3s ease;will-change:transform}
#bg i:nth-child(1){background:color-mix(in srgb,var(--cur) 65%,#fff);top:-25vmax;left:-20vmax;animation:d1 26s ease-in-out infinite alternate}
#bg i:nth-child(2){background:color-mix(in srgb,var(--cur) 88%,#000);bottom:-30vmax;right:-20vmax;animation:d2 32s ease-in-out infinite alternate}
#bg i:nth-child(3){background:color-mix(in srgb,var(--cur) 75%,#fff);top:20vh;left:30vw;width:50vmax;height:50vmax;animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(45vmax,30vmax) scale(1.25)}}
@keyframes d2{to{transform:translate(-50vmax,-25vmax) scale(.85)}}
@keyframes d3{50%{transform:translate(-30vmax,25vmax) scale(1.3)}to{transform:translate(25vmax,-20vmax) scale(.9)}}
@media (prefers-reduced-motion:reduce){#bg i{animation:none}}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;transition:opacity .9s ease, transform .9s ease}
#entry{cursor:pointer;font-size:1.15rem;letter-spacing:.18em;color:var(--soft);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
#main{opacity:0;pointer-events:none;transform:translateY(10px)}
body.in #entry{opacity:0;pointer-events:none;transform:scale(1.03);animation:none}
body.in #main{opacity:1;pointer-events:auto;transform:none;transition-delay:.35s}
#timer{font-size:clamp(3.5rem,16vw,9rem);font-weight:400;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
#prompt{margin:3.2rem 0 .9rem;font-size:1.2rem;font-style:italic;color:var(--soft)}
#row{display:flex;align-items:center;width:min(560px,100%);border-bottom:1.5px solid rgba(43,43,43,.35);transition:border-color .3s}
#row:focus-within{border-color:var(--ink)}
#text{flex:1;border:0;background:transparent;font:inherit;font-size:1.25rem;color:var(--ink);padding:.6rem .2rem;outline:none;min-width:0}
#go{border:0;background:transparent;font:inherit;font-size:1.6rem;color:var(--ink);cursor:pointer;padding:.2rem .6rem;opacity:.6;transition:opacity .2s}
#go:hover,#go:focus-visible{opacity:1}
#err{height:1.2rem;margin-top:.6rem;font-size:.9rem;color:#8a3b3b}
#hbtn{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  border:0;background:none;font:inherit;font-size:.8rem;letter-spacing:.15em;color:var(--ink);opacity:0;pointer-events:none;cursor:pointer;transition:opacity .4s}
body.in #hbtn{opacity:.28;pointer-events:auto}
body.in #hbtn:hover,body.in #hbtn:focus-visible{opacity:.8}
#hist{position:fixed;inset:0;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);opacity:0;pointer-events:none;
  transition:opacity .4s;overflow-y:auto;padding:56px 24px calc(56px + env(safe-area-inset-bottom,0px))}
#hist.open{opacity:1;pointer-events:auto}
#hist .wrap{max-width:560px;margin:0 auto}
#hist h2{font-weight:400;font-style:italic;color:var(--soft);font-size:1.1rem;margin:0 0 2rem}
.item{margin-bottom:1.6rem}
.item time{display:block;font-size:.8rem;letter-spacing:.08em;color:var(--soft);margin-bottom:.2rem}
.item p{margin:0;font-size:1.1rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
#close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:18px;border:0;background:none;font:inherit;font-size:1.8rem;color:var(--ink);opacity:.5;cursor:pointer}
.empty{color:var(--soft);font-style:italic}
#ask{display:none;flex-direction:column;align-items:center;text-align:center;width:min(560px,100%);margin-top:3rem}
body.asking #ask{display:flex;animation:fi .6s ease}
body.asking #prompt,body.asking #row{display:none}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
#atext{font-style:italic;color:var(--soft);font-size:1rem;margin-bottom:1.2rem;overflow-wrap:anywhere;max-height:5.5rem;overflow:hidden}
#aq{font-size:1.3rem;margin-bottom:1.4rem}
#opts{display:flex;gap:1.2rem}
#opts button{border:0;border-bottom:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent);background:transparent;font:inherit;font-size:1.2rem;color:var(--ink);padding:.3rem .9rem;cursor:pointer;transition:border-color .2s}
#opts button:hover,#opts button:focus-visible{border-color:var(--ink);outline:none}
#rst{opacity:.6}
#cbtn{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(50% - 3.2rem);transform:translateX(-50%);border:0;background:none;font:inherit;font-size:.8rem;letter-spacing:.15em;color:var(--ink);opacity:0;pointer-events:none;cursor:pointer;transition:opacity .4s}
#hbtn{left:calc(50% + 3.2rem)}
body.in #cbtn{opacity:.28;pointer-events:auto}
body.in #cbtn:hover,body.in #cbtn:focus-visible{opacity:.8}
#cal{position:fixed;inset:0;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s;overflow-y:auto;padding:56px 18px calc(56px + env(safe-area-inset-bottom,0px))}
#cal.open{opacity:1;pointer-events:auto}
#cal .wrap{max-width:520px;margin:0 auto}
#cclose{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:18px;border:0;background:none;font:inherit;font-size:1.8rem;color:var(--ink);opacity:.5;cursor:pointer}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.ch button{border:0;background:none;font:inherit;font-size:1.8rem;color:var(--ink);cursor:pointer;opacity:.6;padding:.2rem .9rem}
.ch span{font-style:italic;font-size:1.2rem}
#csum{text-align:center;color:var(--soft);font-size:.9rem;margin-bottom:1.4rem}
#cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:.7rem;letter-spacing:.1em;color:var(--soft);padding-bottom:2px}
.cd{aspect-ratio:1;border:0;border-radius:10px;background:rgba(127,127,127,.1);font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0}
.cd small{position:absolute;top:3px;left:6px;font-size:.62rem;color:var(--soft)}
.cd b{font-weight:400;font-size:.95rem}
.cd i{font-style:normal;font-size:.6rem;color:var(--soft)}
.cd.today{outline:1.5px solid var(--ink)}
.cd.sel{outline:1.5px dashed var(--soft);outline-offset:2px}
:root{--ease:cubic-bezier(.32,.72,0,1)}
.screen{transition:opacity 1s var(--ease),transform 1s var(--ease)}
#go,#opts button,.cd,.ch button{transition:opacity .4s var(--ease),transform .4s var(--ease),border-color .4s var(--ease)}
#go:active,#opts button:active,.cd:active,.ch button:active{transform:scale(.97)}
#cbtn,#hbtn{visibility:hidden}
body.in #cbtn,body.in #hbtn{visibility:visible}
#hist,#cal{visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}
#hist.open,#cal.open{visibility:visible;transition-delay:0s}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
#opts button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:0}
.cd:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
#prompt,#aq{text-wrap:balance}
#atext,.item p{text-wrap:pretty}
.item{animation:rise .9s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){.item{animation:none}}
@media (prefers-color-scheme:dark){
  :root{--green:#2f4a33;--yellow:#52492a;--red:#573036;--ink:#f1ede4;--soft:rgba(241,237,228,.6)}
  #hist,#cal{background:rgba(20,20,20,.9)} #err{color:#e8a0a0}
}
</style>
<style>
:root{color-scheme:light;--green:#dcefd9;--yellow:#f6eebf;--red:#f4cfd2;--ink:#000;--soft:#737373;--charcoal:#525252;--mute:#a3a3a3;--hair:#e5e5e5;--hair2:#d4d4d4;
  --rounded:ui-rounded,"SF Pro Rounded","SF Pro Display",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body{font-family:var(--sans)}
#bg i{opacity:.5}
#entry{font:500 18px/1.5 var(--rounded);letter-spacing:0;color:var(--soft)}
#timer{font:500 clamp(3.5rem,14vw,7.5rem)/1 var(--rounded);letter-spacing:0;font-variant-numeric:tabular-nums}
#prompt{margin:48px 0 20px;font:500 24px/1.33 var(--rounded);font-style:normal;color:var(--ink);text-align:center}
#row{width:min(560px,100%);height:48px;padding:0 6px 0 20px;border:1px solid var(--hair2);border-radius:9999px;background:#fff}
#row:focus-within{border-color:#000;box-shadow:0 0 0 3px rgba(59,130,246,.35)}
#text{font:400 16px/1.5 var(--sans);padding:0}
#go{height:36px;padding:0 20px;border-radius:9999px;background:#000;color:#fff;font:500 14px/1 var(--sans);opacity:1}
#go:hover{background:#090909}
#err{font:400 14px/1.43 var(--sans);color:#b42318;text-align:center}
#ask{background:#fff;border:1px solid var(--hair);border-radius:12px;padding:32px 24px;margin-top:48px}
#atext{font:400 14px/1.43 var(--mono);font-style:normal;color:var(--soft);margin-bottom:20px}
#atext::before{content:"$ ";color:var(--mute)}
#aq{font:600 24px/1.33 var(--rounded);color:var(--ink);margin-bottom:20px}
#opts button{height:36px;padding:0 20px;border:1px solid var(--hair2);border-radius:9999px;background:#fff;color:#000;font:500 14px/1 var(--sans)}
#opts #yes{background:#000;border-color:#000;color:#fff}
#opts #yes:hover{background:#090909}
#opts #rst{color:var(--soft)}
#cbtn,#hbtn{font:400 12px/1 var(--sans);letter-spacing:0;color:var(--mute)}
#cbtn{left:calc(50% - 40px)}#hbtn{left:calc(50% + 40px)}
body.in #cbtn,body.in #hbtn{opacity:1}
body.in #cbtn:hover,body.in #hbtn:hover,body.in #cbtn:focus-visible,body.in #hbtn:focus-visible{opacity:1;color:#000}
#hist,#cal{background:rgba(255,255,255,.97);backdrop-filter:none}
#hist h2{font:600 24px/1.33 var(--rounded);font-style:normal;color:var(--ink);margin:0 0 24px}
.item{margin:0;padding:16px 0;border-bottom:1px solid var(--hair)}
.item time{font:400 12px/1.33 var(--mono);letter-spacing:0;color:var(--mute);margin-bottom:4px}
.item p{font:400 16px/1.5 var(--sans);color:var(--charcoal)}
.empty{font-style:normal;color:var(--soft)}
.ch span{font:600 24px/1.33 var(--rounded);font-style:normal}
.ch button{width:36px;height:36px;padding:0;border:1px solid var(--hair2);border-radius:9999px;font-size:18px;line-height:1;opacity:1}
#csum{font:400 14px/1.43 var(--sans);color:var(--soft)}
.wd{font:500 12px/1.33 var(--sans);letter-spacing:0;color:var(--mute)}
.cd{border:1px solid var(--hair);border-radius:12px;background:#fff;font-family:var(--sans)}
.cd b{font-weight:500;font-size:14px}
.cd i{font-size:11px}
.cd.today,.cd.sel{outline:none}
.cd.today{border-color:var(--hair2)}
.cd.today small{color:#000;font-weight:600}
.cd.sel{border-color:#000}
#close,#cclose{color:#000;opacity:.6}
</style>
<style>
#intro{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:3}
#intro .ring,#sphere{position:absolute;left:var(--x,50%);top:var(--y,50%);border-radius:50%;aspect-ratio:1;opacity:0;transform:translate(-50%,-50%) scale(0)}
#sphere{width:min(70vmin,560px);background:linear-gradient(255deg,rgb(250,203,14),rgb(240,107,168) 30%,rgb(120,186,230) 65%,#fff)}
#intro .ring{border:1px solid rgba(29,29,29,.22)}
.r1{width:46vmin}.r2{width:72vmin}.r3{width:104vmin}
body.in #sphere{animation:bloom 1.8s cubic-bezier(.32,.72,0,1) forwards}
body.in .ring{animation:ripple 1.7s cubic-bezier(.32,.72,0,1) forwards}
body.in .r2{animation-delay:.12s}body.in .r3{animation-delay:.24s}
@keyframes bloom{0%{opacity:1;transform:translate(-50%,-50%) scale(0)}42%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
@keyframes ripple{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
#prompt{margin:40px 0 24px;font:400 clamp(32px,8vw,46px)/.9 var(--rounded);letter-spacing:.013em;text-transform:uppercase;text-align:center}
#prompt label{display:block}
.ln{display:block;overflow:hidden;padding:.06em 0 .1em}
.ln>span{display:block;transform:translateY(115%)}
body.in .ln>span{transform:none;transition:transform 1.1s var(--ease)}
body.in .ln:nth-child(1)>span{transition-delay:1.05s}
body.in .ln:nth-child(2)>span{transition-delay:1.15s}
body.in .ln:nth-child(3)>span{transition-delay:1.25s}
#timer{opacity:0;transform:translateY(28px);filter:blur(10px)}
body.in #timer{opacity:1;transform:none;filter:none;transition:opacity 1.1s var(--ease) .95s,transform 1.1s var(--ease) .95s,filter 1.1s var(--ease) .95s}
#row{opacity:0;transform:translateY(16px)}
body.in #row{opacity:1;transform:none;transition:opacity 1s var(--ease) 1.4s,transform 1s var(--ease) 1.4s,border-color .3s ease,box-shadow .3s ease}
#cbtn,#hbtn{font:400 11px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase}
#cbtn::after,#hbtn::after{content:" \2192"}
#cbtn{left:calc(50% - 64px)}#hbtn{left:calc(50% + 64px)}
@media (prefers-reduced-motion:reduce){#intro{display:none}.ln>span,#timer,#row{transform:none;opacity:1;filter:none;transition:none!important}}
</style>
<style>
#timer{font-size:clamp(4rem,19vw,14rem)}
#row{margin-top:56px}
#text::placeholder{color:var(--mute);opacity:1}
</style>
<style>
#tlabel{font:400 11px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:12px;opacity:0;transform:translateY(12px)}
body.in #tlabel{opacity:1;transform:none;transition:opacity 1s var(--ease) 1.05s,transform 1s var(--ease) 1.05s}
@media (prefers-reduced-motion:reduce){#tlabel{opacity:1;transform:none;transition:none!important}}
</style>
<style>
#mbtn{position:fixed;right:22px;top:calc(14px + env(safe-area-inset-top,0px));border:0;background:none;font:400 11px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);cursor:pointer;visibility:hidden;opacity:0;transition:opacity .4s}
body.in #mbtn{visibility:visible;opacity:1}
#mbtn:hover,#mbtn:focus-visible{color:#000}
</style>
<script>(function(){var t=null;try{t=localStorage.getItem('timetrace:theme');}catch(e){}if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
#tbtn{position:fixed;left:22px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;border:0;background:none;font:400 11px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);cursor:pointer;visibility:hidden;opacity:0;transition:opacity .4s}
body.in #tbtn{visibility:visible;opacity:1}
#tbtn:hover,#tbtn:focus-visible{color:var(--ink)}
#tbtn i{position:relative;width:28px;height:16px;border:1px solid currentColor;border-radius:9999px}
#tbtn i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:currentColor;transition:transform .4s var(--ease)}
#tbtn[aria-checked=true] i::after{transform:translateX(12px)}
:root[data-theme=dark]{color-scheme:dark;--green:#2f4a33;--yellow:#52492a;--red:#573036;--ink:#f4f4f2;--soft:#b5b5b5;--charcoal:#d4d4d4;--mute:#9a9a9a;--hair:#3a3a3a;--hair2:#505050}
[data-theme=dark] #row,[data-theme=dark] #ask,[data-theme=dark] .cd,[data-theme=dark] #opts button{background:#171717}
[data-theme=dark] #row:focus-within{border-color:#fff}
[data-theme=dark] #go{background:#fff;color:#000}
[data-theme=dark] #go:hover{background:#e5e5e5}
[data-theme=dark] #opts button{color:#fff}
[data-theme=dark] #opts #yes{background:#fff;color:#000;border-color:#fff}
[data-theme=dark] #opts #yes:hover{background:#e5e5e5}
[data-theme=dark] #opts #rst{color:var(--soft)}
[data-theme=dark] #hist,[data-theme=dark] #cal{background:rgba(15,15,15,.97)}
[data-theme=dark] #close,[data-theme=dark] #cclose{color:#fff}
[data-theme=dark] body.in #cbtn:hover,[data-theme=dark] body.in #hbtn:hover,[data-theme=dark] body.in #cbtn:focus-visible,[data-theme=dark] body.in #hbtn:focus-visible,[data-theme=dark] #mbtn:hover,[data-theme=dark] #mbtn:focus-visible{color:#fff}
[data-theme=dark] .cd.today small{color:#fff}
[data-theme=dark] .cd.sel{border-color:#fff}
[data-theme=dark] #err{color:#f19b92}
[data-theme=dark] #intro .ring{border-color:rgba(255,255,255,.22)}
</style>
<style>
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border:1px solid currentColor;border-radius:9999px;font:500 10px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;vertical-align:1px}
.tag.yes{color:#1f7a3a}.tag.no{color:#b42318}
.item:has(.tag.yes){background:rgba(31,122,58,.09)}
.item:has(.tag.no){background:rgba(180,35,24,.08)}
.item:has(.tag){padding:16px 14px;margin:0 -14px 6px;border-radius:12px;border-bottom-color:transparent}
[data-theme=dark] .tag.yes{color:#7fd197}[data-theme=dark] .tag.no{color:#f19b92}
[data-theme=dark] .item:has(.tag.yes){background:rgba(127,209,151,.12)}
[data-theme=dark] .item:has(.tag.no){background:rgba(241,155,146,.12)}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="intro" aria-hidden="true"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i id="sphere"></i></div>
<div id="entry" class="screen" tabindex="0" role="button" aria-label="Enter">click anywhere</div>

<main id="main" class="screen" inert>
  <div id="tlabel">No check in yet</div>
  <div id="timer" aria-live="off">0:00:00</div>
  
  <div id="row">
    <input id="text" type="text" autocomplete="off" maxlength="1000" placeholder="" aria-label="What have you been doing?">
    <button id="go" aria-label="Check in">Check in</button>
  </div>
  <div id="ask"><div id="atext"></div><div id="aq">Was it productive?</div><div id="opts"><button id="yes">yes</button><button id="no">no</button><button id="rst">reset</button></div></div>
  <div id="err" role="status"></div>
</main>

<nav aria-label="Pages"><button id="cbtn">calendar</button>
<button id="hbtn">history</button><button id="mbtn" aria-pressed="false">Sound on</button>
<button id="tbtn" role="switch" aria-checked="false"><span>Dark mode</span><i aria-hidden="true"></i></button></nav>
<div id="cal" role="dialog" aria-modal="true" aria-label="Calendar"><button id="cclose" aria-label="Close">×</button><div class="wrap">
  <div class="ch"><button id="cprev" aria-label="Previous month">‹</button><span id="cmonth"></span><button id="cnext" aria-label="Next month">›</button></div>
  <div id="csum"></div><div id="cgrid"></div><div id="cday" style="margin-top:2rem"></div>
</div></div>
<div id="hist" role="dialog" aria-modal="true" aria-label="History"><button id="close" aria-label="Close">×</button><div class="wrap"><h2>History</h2><div id="list"></div></div></div>

<script>
(function(){
  var KEY='timetrace:v1', $=function(i){return document.getElementById(i)};
  var entries=[];
  function load(){
    try{var r=localStorage.getItem(KEY); var d=r?JSON.parse(r):[]; if(Array.isArray(d)) entries=d.filter(function(e){return e&&typeof e.t==='number'});}catch(e){entries=[];}
  }
  function save(next){
    try{
      localStorage.setItem(KEY,JSON.stringify(next));
      return localStorage.getItem(KEY)===JSON.stringify(next);
    }catch(e){return false;}
  }
  load();
  function last(){return entries.length?entries[entries.length-1].t:null}
  var pad=function(n){return n<10?'0'+n:''+n};
  function tick(){
    var l=last(), s=l===null?0:Math.max(0,Math.floor((Date.now()-l)/1000));
    var h=Math.floor(s/3600), m=Math.floor(s%3600/60);
    $('timer').textContent=h+':'+pad(m)+':'+pad(s%60);
    var st=s>=7200?2:s>=3600?1:0;
    document.body.classList.toggle('s1',st===1);
    document.body.classList.toggle('s2',st===2);
    if(typeof lastSt==='number'&&st>lastSt&&document.body.classList.contains('in'))snd[st===1?'hour1':'hour2']();
    lastSt=st;
    document.title=(l===null?'':h+':'+pad(m)+' · ')+'TimeTrace';
    $('tlabel').textContent=l===null?'No check in yet':'Since your last check in';
  }
  tick(); setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
  window.addEventListener('storage',function(e){if(e.key===KEY){load();tick();}});

  function enter(e){
    if(document.body.classList.contains('in'))return;
    var ix=$('intro').style, cl=e&&e.type==='click'&&e.clientX;
    ix.setProperty('--x',(cl?e.clientX:innerWidth/2)+'px'); ix.setProperty('--y',(cl?e.clientY:innerHeight/2)+'px');
    document.body.classList.add('in');
    snd.bloom();
    $('main').removeAttribute('inert'); $('entry').setAttribute('inert','');
    setTimeout(function(){$('text').focus({preventScroll:true})},1600);
  }
  $('entry').addEventListener('click',enter);
  $('entry').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();enter();}});

  function submit(){
    var v=$('text').value.trim();
    if(!v){$('err').textContent='Write what you have been doing first.';$('text').focus();return;}
    load(); // pick up any entries saved in another tab
    pending={t:Date.now(),text:v}; $('err').textContent='';
    $('atext').textContent=v; document.body.classList.add('asking');
    setTimeout(function(){$('yes').focus({preventScroll:true})},50);
  }
  function answer(p){
    if(!pending)return;
    load();
    var next=entries.concat([{t:pending.t,text:pending.text,p:p}]);
    if(save(next)){
      entries=next; pending=null; $('text').value=''; $('err').textContent='';
      document.body.classList.remove('asking');
      if(p===true)snd.yes();else if(p===false)snd.no();else snd.reset();
      snd.save(); tick(); nudge(); $('text').focus();
    }else{
      $('err').textContent="Couldn't save. Your check-in was not recorded.";
    }
  }
  function cancelAsk(){pending=null;document.body.classList.remove('asking');$('text').focus();}
  var pending=null;
  $('text').addEventListener('input',function(){$('err').textContent='';});
  var nudges=['Any progress?..','Time is money..','Where did the time go?..','Still on track?..','What did you get done?..','Worth the time?..'];
  function nudge(){
    var cur=$('text').placeholder, n;
    do{n=nudges[Math.floor(Math.random()*nudges.length)];}while(n===cur&&nudges.length>1);
    $('text').placeholder=n;
  }
  nudge();
  setInterval(function(){if(!pending&&!$('text').value)nudge();},7000);

  var AC=null, muted=false, lastSt;
  try{muted=localStorage.getItem('timetrace:mute')==='1';}catch(e){}
  function actx(){
    if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
    if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
    return AC;
  }
  function tone(f,t0,d,type,v,to){
    if(muted)return; var c=actx(); if(!c)return;
    var o=c.createOscillator(), g=c.createGain(), s=c.currentTime+t0;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,s);
    if(to)o.frequency.exponentialRampToValueAtTime(to,s+d);
    g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(v,s+Math.min(.04,d/3)); g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g); g.connect(c.destination); o.start(s); o.stop(s+d+.05);
  }
  var snd={
    bloom:function(){tone(220,0,1.3,'sine',.05,440);tone(330,.1,1.4,'sine',.035,660);tone(660,.5,1.2,'sine',.02,880);},
    save:function(){tone(392,0,1,'sine',.05);tone(261.6,0,1.2,'sine',.035);},
    yes:function(){tone(523.3,.3,.4,'sine',.05);tone(784,.45,.6,'sine',.05);},
    no:function(){tone(196,.3,.45,'triangle',.05,160);},
    reset:function(){tone(1100,.3,.05,'square',.012);},
    hour1:function(){tone(659.3,0,1.2,'sine',.07);tone(880,.35,1.6,'sine',.06);},
    hour2:function(){[0,1.9].forEach(function(o){tone(880,o,.5,'triangle',.08);tone(698.5,o+.3,.5,'triangle',.08);tone(523.3,o+.6,1,'triangle',.08);});},
    open:function(){tone(600,0,.2,'sine',.03,760);},
    close:function(){tone(520,0,.18,'sine',.025,400);}
  };
  var mb=$('mbtn');
  function paintMute(){mb.textContent=muted?'Sound off':'Sound on';mb.setAttribute('aria-pressed',muted?'true':'false');}
  paintMute();
  mb.addEventListener('click',function(){
    muted=!muted; try{localStorage.setItem('timetrace:mute',muted?'1':'0');}catch(e){}
    paintMute(); if(!muted)snd.open();
  });
  var tb=$('tbtn'), root=document.documentElement;
  function paintTheme(){
    var d=root.getAttribute('data-theme')==='dark', m=document.querySelector('meta[name=theme-color]');
    tb.setAttribute('aria-checked',d?'true':'false');
    if(m)m.setAttribute('content',d?'#2f4a33':'#dcefd9');
  }
  paintTheme();
  tb.addEventListener('click',function(){
    var d=root.getAttribute('data-theme')!=='dark';
    root.setAttribute('data-theme',d?'dark':'light');
    try{localStorage.setItem('timetrace:theme',d?'dark':'light');}catch(e){}
    paintTheme(); snd.open();
  });
  $('yes').onclick=function(){answer(true)};
  $('no').onclick=function(){answer(false)};
  $('rst').onclick=function(){answer(null)};
  $('go').addEventListener('click',submit);
  $('text').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit();}});

  var fmt=function(t){
    var d=new Date(t);
    return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  };
  function openHist(){
    load();
    var box=$('list'); box.textContent='';
    if(!entries.length){var p=document.createElement('p');p.className='empty';p.textContent='Nothing yet.';box.appendChild(p);}
    entries.slice().reverse().forEach(function(e){
      var it=document.createElement('div'); it.className='item';
      var t=document.createElement('time'); t.textContent=fmt(e.t); tag(t,e);
      var p=document.createElement('p'); p.textContent=e.text;
      it.appendChild(t); it.appendChild(p); box.appendChild(it);
    });
    $('hist').classList.add('open');
  }
  function closeHist(){snd.close();$('hist').classList.remove('open');$('text').focus({preventScroll:true});}
  $('hbtn').addEventListener('click',function(){snd.open();openHist();});
  $('close').addEventListener('click',closeHist);
  var mark=function(e){return e.p===true?' · productive':e.p===false?' · not productive':''};
  function tag(t,e){
    if(e.p!==true&&e.p!==false)return;
    var s=document.createElement('span'); s.className='tag '+(e.p?'yes':'no'); s.textContent=e.p?'Productive':'Not productive'; t.appendChild(s);
  }
  var cm=new Date(); cm.setDate(1); var sel=null;
  function renderCal(){
    load();
    var m={}; entries.forEach(function(e){var d=new Date(e.t),k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());var s=m[k]||(m[k]={y:0,n:0,list:[]});s.list.push(e);if(e.p===true)s.y++;else if(e.p===false)s.n++;});
    var g=$('cgrid'); g.textContent='';
    var y=cm.getFullYear(), mo=cm.getMonth(), n=new Date();
    var today=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());
    $('cmonth').textContent=cm.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    ['M','T','W','T','F','S','S'].forEach(function(w){var d=document.createElement('div');d.className='wd';d.textContent=w;g.appendChild(d);});
    var lead=(new Date(y,mo,1).getDay()+6)%7, days=new Date(y,mo+1,0).getDate(), ty=0, tn=0;
    for(var i=0;i<lead;i++) g.appendChild(document.createElement('div'));
    for(var d=1;d<=days;d++){
      var key=y+'-'+pad(mo+1)+'-'+pad(d), s=m[key], b=document.createElement('button');
      b.className='cd'+(key===today?' today':'')+(key===sel?' sel':'');
      var sm=document.createElement('small'); sm.textContent=d; b.appendChild(sm);
      if(s){
        var sc=s.y+s.n; ty+=s.y; tn+=s.n;
        var ii=document.createElement('i');
        if(sc){
          var pc=Math.round(100*s.y/sc);
          b.style.background='hsla('+Math.round(pc*1.2)+',55%,68%,.6)';
          var bb=document.createElement('b'); bb.textContent=pc+'%'; b.appendChild(bb);
          ii.textContent=s.y+'/'+sc;
        }else ii.textContent='·';
        b.appendChild(ii);
      }
      b.onclick=(function(k){return function(){sel=k;renderCal();};})(key);
      g.appendChild(b);
    }
    $('csum').textContent=(ty+tn)?ty+' productive · '+tn+' not · '+Math.round(100*ty/(ty+tn))+'% this month':'no scored sessions this month';
    var box=$('cday'); box.textContent='';
    if(sel&&m[sel]) m[sel].list.slice().reverse().forEach(function(e){
      var it=document.createElement('div'); it.className='item';
      var t=document.createElement('time'); t.textContent=new Date(e.t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); tag(t,e);
      var p=document.createElement('p'); p.textContent=e.text;
      it.appendChild(t); it.appendChild(p); box.appendChild(it);
    });
  }
  function closeCal(){snd.close();$('cal').classList.remove('open');$('text').focus({preventScroll:true});}
  $('cbtn').addEventListener('click',function(){snd.open();renderCal();$('cal').classList.add('open');});
  $('cclose').addEventListener('click',closeCal);
  $('cal').addEventListener('click',function(e){if(e.target===this)closeCal();});
  $('hist').addEventListener('click',function(e){if(e.target===this)closeHist();});
  $('cprev').addEventListener('click',function(){cm.setMonth(cm.getMonth()-1);sel=null;renderCal();});
  $('cnext').addEventListener('click',function(){cm.setMonth(cm.getMonth()+1);sel=null;renderCal();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if($('cal').classList.contains('open')){closeCal();return;}
      if($('hist').classList.contains('open')){closeHist();return;}
      if(pending)cancelAsk();
      return;
    }
    if(pending&&!e.metaKey&&!e.ctrlKey){var k=e.key.toLowerCase();if(k==='y')answer(true);else if(k==='n')answer(false);else if(k==='r')answer(null);}
  });
})();
</script>
</body>
</html>
